
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.iebundlepacker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iebundlepacker'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'

        // Support Android ARM32 and ARM64 only.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'

        pip {
            install 'UnityPy'
            install 'Pillow'
        }
    }
}
