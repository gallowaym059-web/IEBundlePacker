plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.iebundlepacker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iebundlepacker'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.7.0'

        // Only Android ARM32 and ARM64 are supported.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// UnityPy's Python source is vendored by .github/workflows/android-apk.yml.
// Do not pip-install UnityPy: its optional UnityPyBoost C++ extension is not
// built for Android. The pure-Python fallback is supported by upstream.
chaquopy {
    defaultConfig {
        version = '3.11' // Required for ARM32 + ARM64 with Chaquopy.
        pip {
            // Do NOT use --no-deps here. Chaquopy's native wheels (Pillow, lz4,
            // Brotli) declare the Android shared libraries they need (libjpeg,
            // libpng, freetype, libc++_shared, ...) as dependencies, so pip must
            // resolve them. UnityPy itself is vendored, not pip-installed, so none
            // of its desktop-only optional dependencies are pulled in.
            install('attrs==25.3.0')
            install('fsspec==2025.3.0')
            install('chaquopy-libcxx') // libc++_shared.so (also resolved as a dependency)
            install('Brotli==1.0.7')
            install('lz4==4.3.2')
            install('Pillow==11.0.0')
            install('typing-extensions==4.12.2')
        }
    }
}
