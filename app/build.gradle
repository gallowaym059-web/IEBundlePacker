
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.iebundlepacker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iebundlepacker'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.4.0'

        // Android ARM32 and ARM64 only.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'

        pip {
            install 'Pillow'
        }
    }
}
