plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.iebundlepacker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iebundlepacker'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.5.0'

        // Only Android ARM32 and ARM64 are supported.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep the Python runtime dependency-free at build time. UnityPy cannot be
// installed from source by Chaquopy because its native extensions require an
// Android-compatible prebuilt wheel/toolchain. The backend reports this clearly.
chaquopy {
    defaultConfig {
        version = '3.11'
    }
}
